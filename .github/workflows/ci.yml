name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: termini
          POSTGRES_PASSWORD: termini
          POSTGRES_DB: termini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U termini"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Na PostgreSQL-u se izvršava i test koji provjerava da sama baza
      # odbija termine koji se preklapaju.
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://termini:termini@localhost:5432/termini' || '' }}
      # Test pada ako posao ne radi na bazi koju mu ime tvrdi.
      EXPECTED_DATABASE: ${{ matrix.database == 'postgres' && 'postgresql' || 'sqlite' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migracije su usklađene s modelima
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "1"
      - name: Testovi
        run: pytest -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
